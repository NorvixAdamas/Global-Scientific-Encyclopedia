name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site (no build step)
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --delete \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/tests/' \
            --exclude '/scripts/' \
            --exclude '/netlify/' \
            --exclude '/node_modules/' \
            --exclude '/.freebuff/' \
            --exclude '/.env' \
            --exclude '/.env.*' \
            ./ _site/
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/css/v2.css

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
