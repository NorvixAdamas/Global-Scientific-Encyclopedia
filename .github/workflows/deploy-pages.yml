name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub không cho GITHUB_TOKEN tự tạo Pages site (lỗi
      # "Resource not accessible by integration"). Kiểm tra trước để log chỉ
      # đúng việc cần làm thay vì một lỗi API khó hiểu.
      - name: Check that GitHub Pages is enabled
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Pages chưa bật cho repo này. Vào Settings -> Pages -> Source = GitHub Actions (một lần duy nhất), rồi chạy lại workflow này."
            cat /tmp/pages.json || true
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site (no build step)
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --delete \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/tests/' \
            --exclude '/scripts/' \
            --exclude '/netlify/' \
            --exclude '/node_modules/' \
            --exclude '/.freebuff/' \
            --exclude '/.env' \
            --exclude '/.env.*' \
            ./ _site/
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/css/v2.css

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
